name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 for sdkmanager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-30" \
            "build-tools;30.0.3"

      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ZHIYE_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > freader-release.jks

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.ZHIYE_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZHIYE_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ZHIYE_RELEASE_KEY_PASSWORD }}
        run: |
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="app/build/outputs/apk/release/ZhiYe-aligned.apk"
          signed="app/build/outputs/apk/release/ZhiYe-release.apk"
          "$ANDROID_HOME/build-tools/30.0.3/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$ANDROID_HOME/build-tools/30.0.3/apksigner" sign \
            --ks freader-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$signed" \
            "$aligned"
          "$ANDROID_HOME/build-tools/30.0.3/apksigner" verify --verbose "$signed"

      - name: Prepare release metadata
        id: version
        run: |
          badging="$("$ANDROID_HOME/build-tools/30.0.3/aapt" dump badging app/build/outputs/apk/release/ZhiYe-release.apk)"
          version_name="$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          version_code="$(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          tag="v${version_name}-code${version_code}"
          apk="ZhiYe-v${version_name}-code${version_code}.apk"
          cp app/build/outputs/apk/release/ZhiYe-release.apk "$apk"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.version.outputs.apk }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          notes="自动构建版本：${GITHUB_SHA}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "知页 v${VERSION_NAME}" --notes "$notes" --latest
          else
            gh release create "$TAG" "$APK" --title "知页 v${VERSION_NAME}" --notes "$notes" --latest
          fi
